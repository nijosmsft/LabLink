[Unit]
Requires=lablink-disable-conflicting-firewalls.service lablink-appliance-firewall.service
After=lablink-disable-conflicting-firewalls.service lablink-appliance-firewall.service network-online.target

[Service]
Environment=LABLINK_APPLIANCE_MODE=true
Environment=LABLINK_APPLIANCE_MANIFEST=/var/lib/lablink-agent/appliance/version-manifest.json
ExecStartPre=/usr/bin/test -s /var/lib/lablink-agent/appliance/version-manifest.json
