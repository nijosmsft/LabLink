syntax = "proto3";
package agent;
option go_package = "github.com/nijosmsft/lablink/proto/agent";

service NodeAgent {
  // Execute a command and stream stdout/stderr back in real-time.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);

  // Execute an inline script (pushed as temp file, executed, cleaned up).
  rpc ExecuteScript(ExecuteScriptRequest) returns (stream ExecuteResponse);

  // Push a file from MCP server to the agent node.
  rpc PushFile(stream PushFileRequest) returns (PushFileResponse);

  // Pull a file from the agent node to the MCP server.
  rpc PullFile(PullFileRequest) returns (stream PullFileResponse);

  // List running processes.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);

  // Kill a process by PID.
  rpc KillProcess(KillProcessRequest) returns (KillProcessResponse);

  // Health check and node metadata.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);

  // List tracked background jobs (detached executions).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Get a single job's metadata.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // Get captured output for a job (stdout and/or stderr).
  rpc GetJobOutput(GetJobOutputRequest) returns (GetJobOutputResponse);

  // Cancel a running job (terminates the process tree).
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // Delete a terminal job (removes the job directory).
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);

  // Watch job lifecycle events. On connect, the agent replays a snapshot of
  // current jobs as Started events, then streams live updates.
  rpc WatchJobs(WatchJobsRequest) returns (stream JobEvent);

  // Forward TCP bytes bidirectionally between the operator and a target on
  // the agent node. The first client message MUST set target_addr; the agent
  // dials it (TCP) and then byte-shuttles in both directions. Either side
  // sends {close: true} to signal half-close. Used to tunnel application
  // protocols (e.g. an MCP server bound to localhost on the node) through the
  // node agent's existing mTLS channel.
  rpc Forward(stream ForwardChunk) returns (stream ForwardChunk);

  // Discover authoritative isolated-appliance state.
  rpc GetApplianceState(GetApplianceStateRequest)
      returns (GetApplianceStateResponse);

  // Atomically reserve appliance-owned network resources.
  rpc ReserveResources(ReserveResourcesRequest)
      returns (ReserveResourcesResponse);

  // Release appliance-owned network resources after their retirement barrier.
  rpc ReleaseResources(ReleaseResourcesRequest)
      returns (ReleaseResourcesResponse);

  // Revoke the current physical-host lease before releasing it on the host.
  rpc ReleaseApplianceAuthority(MutationHeader) returns (FenceState);

  // Atomically freeze the parent generation before an approved cascade.
  rpc SetApplianceParentLifecycle(SetApplianceParentLifecycleRequest)
      returns (FenceState);

  // Apply or retire a private network.
  rpc ApplyPrivateNetwork(ApplyPrivateNetworkRequest)
      returns (ApplyPrivateNetworkResponse);
  rpc RemovePrivateNetwork(RemovePrivateNetworkRequest)
      returns (RemovePrivateNetworkResponse);

  // Register or retire an isolated guest.
  rpc RegisterIsolatedGuest(RegisterIsolatedGuestRequest)
      returns (RegisterIsolatedGuestResponse);
  rpc RemoveIsolatedGuest(RemoveIsolatedGuestRequest)
      returns (RemoveIsolatedGuestResponse);

  // Manage TCP relays to isolated guests.
  rpc ApplyRelay(ApplyRelayRequest) returns (Relay);
  rpc RemoveRelay(RemoveRelayRequest) returns (Relay);
  rpc ListRelays(ListRelaysRequest) returns (ListRelaysResponse);
  rpc GetRelayStats(GetRelayStatsRequest) returns (GetRelayStatsResponse);
  rpc RebindRelays(RebindRelaysRequest) returns (RebindRelaysResponse);
  rpc ValidateRelay(ValidateRelayRequest) returns (ValidateRelayResponse);
  rpc AdoptRelay(AdoptRelayRequest) returns (Relay);

  // Manage per-guest NAT state.
  rpc SetNatState(SetNatStateRequest) returns (NatState);
  rpc ListNatState(ListNatStateRequest) returns (ListNatStateResponse);
  rpc ReconcileNat(ReconcileNatRequest) returns (ReconcileNatResponse);
}

message ExecuteRequest {
  string command = 1;
  string shell = 2;             // "powershell", "cmd", "bash" (auto-detect if empty)
  string working_dir = 3;
  map<string, string> env = 4;
  int32 timeout_seconds = 5;    // 0 = no timeout
  bool detach = 6;              // Start detached (survives agent restart)
}

message ExecuteScriptRequest {
  string script_body = 1;       // Inline script content
  string shell = 2;             // "powershell", "bash" (auto-detect if empty)
  string working_dir = 3;
  map<string, string> env = 4;
  int32 timeout_seconds = 5;
  repeated string args = 6;     // Script arguments
}

message ExecuteResponse {
  enum Stream {
    STDOUT = 0;
    STDERR = 1;
  }
  Stream stream = 1;
  bytes data = 2;
  bool done = 3;
  int32 exit_code = 4;          // Valid when done=true
  int32 pid = 5;                // PID of spawned process (sent in first message)
  string job_id = 6;            // Set when detach=true; empty for foreground executions
}

message PushFileRequest {
  string remote_path = 1;       // Destination path on the agent node
  bytes chunk = 2;              // File data chunk (64KB)
  bool is_last = 3;             // True for the final chunk
  int64 file_size = 4;          // Total size (sent in first message, 0 if unknown)
}

message PushFileResponse {
  int64 bytes_written = 1;
  string remote_path = 2;
}

message PullFileRequest {
  string remote_path = 1;       // File path on the agent node
}

message PullFileResponse {
  bytes chunk = 1;              // File data chunk
  int64 total_size = 2;         // Total file size (sent in first message)
}

message ListProcessesRequest {
  string name_filter = 1;       // Optional substring filter on process name
}

message ListProcessesResponse {
  repeated ProcessInfo processes = 1;
}

message ProcessInfo {
  int32 pid = 1;
  string name = 2;
  string command_line = 3;
  int64 memory_bytes = 4;
  double cpu_percent = 5;
}

message KillProcessRequest {
  int32 pid = 1;
  bool force = 2;               // SIGKILL / TerminateProcess
}

message KillProcessResponse {
  bool success = 1;
  string message = 2;
}

message GetInfoRequest {}

message GetInfoResponse {
  string hostname = 1;
  string os = 2;                // "windows" or "linux"
  string arch = 3;              // "amd64", "arm64"
  int32 cpu_count = 4;
  int64 memory_bytes = 5;
  string agent_version = 6;
  repeated string capabilities = 7;
  uint32 protocol_version = 8;
  bool appliance_ready = 9;
  uint64 appliance_generation = 10;
  string appliance_error = 11;
}

// -----------------------------------------------------------------------------
// Background jobs
//
// A "job" is a detached (fire-and-forget) execution whose stdout/stderr the
// agent captures to disk, and whose terminal status the agent records.
// -----------------------------------------------------------------------------

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_RUNNING     = 1;   // Tracker goroutine alive, process alive
  JOB_STATUS_EXITED      = 2;   // Process exited; exit_code valid
  JOB_STATUS_CANCELED    = 3;   // Operator canceled; process killed
  JOB_STATUS_ORPHANED    = 4;   // Tracker died (agent restart) and pid is gone
}

message Job {
  string job_id = 1;
  string command = 2;
  string shell = 3;
  string working_dir = 4;
  map<string, string> env = 5;
  int32 pid = 6;
  JobStatus status = 7;
  int32 exit_code = 8;          // Valid when status=EXITED
  string started_at = 9;        // RFC3339
  string ended_at = 10;         // RFC3339; empty while running
  int64 stdout_bytes = 11;
  int64 stderr_bytes = 12;
  string error = 13;            // Last recorded error (e.g. start failure)
}

message ListJobsRequest {
  JobStatus status_filter = 1;  // UNSPECIFIED = no filter
  int32 limit = 2;              // 0 = default (50)
}

message ListJobsResponse {
  repeated Job jobs = 1;        // Newest-first
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message GetJobOutputRequest {
  string job_id = 1;
  enum Stream {
    BOTH   = 0;                 // Interleaved by merge of stdout then stderr
    STDOUT = 1;
    STDERR = 2;
  }
  Stream stream = 2;
  int32 tail_lines = 3;         // 0 = whole file (subject to max_bytes)
  int64 max_bytes = 4;          // 0 = default (1 MiB), clamped to 8 MiB
}

message GetJobOutputResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  bool truncated = 3;           // True if the cap was hit
  int64 stdout_total_bytes = 4;
  int64 stderr_total_bytes = 5;
}

message CancelJobRequest {
  string job_id = 1;
  bool force = 2;               // Force-terminate (taskkill /F / SIGKILL)
}

message CancelJobResponse {
  Job job = 1;                  // Updated job meta
}

message DeleteJobRequest {
  string job_id = 1;
}

message DeleteJobResponse {
  bool deleted = 1;
}

message WatchJobsRequest {}

message JobEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    SNAPSHOT         = 1;       // Replay on connect
    STARTED          = 2;
    UPDATED          = 3;
    COMPLETED        = 4;       // Terminal (exited / canceled / orphaned)
    DELETED          = 5;       // Job removed; only job_id is set
  }
  Kind kind = 1;
  Job job = 2;
  string job_id = 3;            // For DELETED events
}

// -----------------------------------------------------------------------------
// TCP forwarding
// -----------------------------------------------------------------------------

// ForwardChunk carries a TCP tunnel control message or a slab of data.
//
// First-message convention: the first client→server ForwardChunk MUST set
// target_addr (e.g. "127.0.0.1:8765"). The agent dials that TCP address with
// a short timeout, then enters a byte-shuttling loop. Subsequent messages on
// either direction carry application bytes in `data`. Setting `close=true`
// indicates the sender is done writing (half-close); the agent forwards EOF
// to the target socket. When the target socket closes its read side, the
// agent sends {close: true} back and ends the stream.
message ForwardChunk {
  string target_addr = 1;       // First client message only
  bytes data = 2;
  bool close = 3;
}

// -----------------------------------------------------------------------------
// Isolated VM appliance
// -----------------------------------------------------------------------------

// MutationHeader is the common idempotency, generation, and fencing envelope
// carried by every appliance mutation.
message MutationHeader {
  string parent_operation_id = 1;
  string mutation_id = 2;
  string semantic_hash = 3;
  string resource_id = 4;
  uint64 expected_generation = 5;
  uint64 new_generation = 6;
  string physical_host_id = 7;
  uint64 host_fence = 8;
  string parent_resource_id = 9;
  uint64 expected_parent_generation = 10;
  string host_lease_id = 11;
  bytes host_lease_secret = 12;
  string cascade_operation_id = 13;
  string cascade_plan_revision = 14;
  string cascade_plan_hash = 15;
  string cascade_item_id = 16;
  int64 host_lease_expires_unix = 17;
  string cascade_resource_kind = 18;
  string cascade_action = 19;
}

// GenerationState records desired, applied, and externally observed versions
// of an appliance resource.
message GenerationState {
  uint64 desired_generation = 1;
  uint64 applied_generation = 2;
  uint64 observed_generation = 3;
  uint64 parent_generation = 4;
}

// FenceState identifies the physical host ownership epoch accepted by the
// appliance. The lease secret is intentionally never returned.
message FenceState {
  string physical_host_id = 1;
  uint64 host_fence = 2;
  string host_lease_id = 3;
  string parent_resource_id = 4;
  uint64 parent_generation = 5;
  bool frozen = 6;
  bool deleting = 7;
  bool lost = 8;
}

message SetApplianceParentLifecycleRequest {
  MutationHeader header = 1;
  string state = 2;
  uint64 new_parent_generation = 3;
  repeated CascadeAuthorityItem cascade_items = 4;
}

message CascadeAuthorityItem {
  string item_id = 1;
  string resource_kind = 2;
  string resource_id = 3;
  string action = 4;
  uint64 expected_generation = 5;
}

// MutationResult describes the durable result of an appliance mutation.
message MutationResult {
  string mutation_id = 1;
  string semantic_hash = 2;
  GenerationState generation = 3;
  string compiled_hash = 4;
  bool replayed = 5;
  uint64 appliance_generation = 6;
}

// ApplyIntent exposes a recoverable intent in the appliance's
// intent/apply/observe/commit protocol.
message ApplyIntent {
  string mutation_id = 1;
  string resource_kind = 2;
  string resource_id = 3;
  uint64 desired_generation = 4;
  uint64 parent_generation = 5;
  uint64 fence = 6;
  string semantic_hash = 7;
  string compiled_hash = 8;
  string phase = 9;
  string error_text = 10;
  int64 created_at_unix = 11;
  int64 updated_at_unix = 12;
}

enum ApplianceErrorCode {
  APPLIANCE_ERROR_CODE_UNSPECIFIED = 0;
  APPLIANCE_ERROR_CODE_SUBNET_IN_USE = 1;
  APPLIANCE_ERROR_CODE_IP_IN_USE = 2;
  APPLIANCE_ERROR_CODE_MAC_IN_USE = 3;
  APPLIANCE_ERROR_CODE_PORT_IN_USE = 4;
  APPLIANCE_ERROR_CODE_CONNTRACK_MARK_IN_USE = 5;
  APPLIANCE_ERROR_CODE_CAPACITY_EXHAUSTED = 6;
  APPLIANCE_ERROR_CODE_GENERATION_CONFLICT = 7;
  APPLIANCE_ERROR_CODE_PARENT_GENERATION_CONFLICT = 8;
  APPLIANCE_ERROR_CODE_FENCE_REJECTED = 9;
  APPLIANCE_ERROR_CODE_PARENT_FROZEN = 10;
  APPLIANCE_ERROR_CODE_RESERVATION_LOST = 11;
}

// InventorySummary contains only capacity and free-set information; it does
// not disclose payloads or lease secrets.
message InventorySummary {
  uint32 max_networks = 1;
  uint32 live_networks = 2;
  uint32 max_guests = 3;
  uint32 live_guests = 4;
  repeated uint32 free_subnet_indices = 5;
  uint32 free_ipv4_count = 6;
  uint32 free_mac_count = 7;
  uint32 free_relay_port_count = 8;
  uint32 free_conntrack_mark_count = 9;
}

// ApplianceConflict can be attached to a gRPC status to provide structured,
// redacted reconciliation data.
message ApplianceConflict {
  ApplianceErrorCode code = 1;
  string message = 2;
  uint64 inventory_generation = 3;
  InventorySummary inventory = 4;
  string resource_id = 5;
  GenerationState generation = 6;
  FenceState fence = 7;
}

message ApplianceState {
  uint32 schema_version = 1;
  uint32 protocol_version = 2;
  bool ready = 3;
  uint64 appliance_generation = 4;
  uint64 inventory_generation = 5;
  FenceState fence = 6;
  string main_ipv4 = 7;
  bool policy_verified = 8;
  bool ipv4_forwarding_enabled = 9;
  string error = 10;
  InventorySummary inventory = 11;
}

message ReservationCandidate {
  string resource_kind = 1;
  string resource_id = 2;
  string network_id = 3;
  optional uint32 subnet_index = 4;
  string ipv4 = 5;
  string mac = 6;
  optional uint32 listen_port = 7;
  optional uint32 conntrack_mark = 8;
}

message Reservation {
  string id = 1;
  string resource_kind = 2;
  string resource_id = 3;
  string network_id = 4;
  optional uint32 subnet_index = 5;
  string ipv4 = 6;
  string mac = 7;
  optional uint32 listen_port = 8;
  optional uint32 conntrack_mark = 9;
  string state = 10;
  uint64 parent_generation = 11;
  int64 created_at_unix = 12;
  int64 retired_at_unix = 13;
}

message PrivateNetwork {
  string id = 1;
  string cidr = 2;
  string gateway_ipv4 = 3;
  string nic_mac = 4;
  string interface_name = 5;
  repeated string dns_servers = 6;
  GenerationState generation = 7;
  string state = 8;
  int64 retired_at_unix = 9;
}

message IsolatedGuest {
  string id = 1;
  string network_id = 2;
  string ipv4 = 3;
  string mac = 4;
  GenerationState generation = 5;
  int64 retired_at_unix = 6;
}

message Relay {
  string id = 1;
  string vm_id = 2;
  string network_id = 3;
  uint32 listen_port = 4;
  string target_ipv4 = 5;
  uint32 target_port = 6;
  GenerationState generation = 7;
  string state = 8;
  string bound_main_ip = 9;
  string last_bind_error = 10;
  int64 retired_at_unix = 11;
}

message NatState {
  string vm_id = 1;
  string network_id = 2;
  string state = 3;
  uint32 conntrack_mark = 4;
  GenerationState generation = 5;
  int64 drain_started_unix = 6;
}

message GetApplianceStateRequest {
  uint32 page_size = 1;
  string page_token = 2;
  bool include_tombstones = 3;
}

message GetApplianceStateResponse {
  ApplianceState appliance = 1;
  repeated Reservation reservations = 2;
  repeated PrivateNetwork networks = 3;
  repeated IsolatedGuest guests = 4;
  repeated Relay relays = 5;
  repeated NatState nat_states = 6;
  repeated ApplyIntent apply_intents = 7;
  string next_page_token = 8;
}

message ReserveResourcesRequest {
  MutationHeader header = 1;
  repeated ReservationCandidate candidates = 2;
}

message ReserveResourcesResponse {
  string reservation_id = 1;
  uint64 resulting_parent_generation = 2;
  uint64 inventory_generation = 3;
  repeated Reservation reservations = 4;
  InventorySummary inventory = 5;
  MutationResult mutation = 6;
}

message ReleaseResourcesRequest {
  MutationHeader header = 1;
  repeated string reservation_ids = 2;
}

message ReleaseResourcesResponse {
  repeated Reservation reservations = 1;
  uint64 resulting_parent_generation = 2;
  uint64 inventory_generation = 3;
  InventorySummary inventory = 4;
  MutationResult mutation = 5;
}

message ApplyPrivateNetworkRequest {
  MutationHeader header = 1;
  string reservation_id = 2;
  string cidr = 3;
  string gateway_ipv4 = 4;
  string nic_mac = 5;
  string interface_name = 6;
  repeated string dns_servers = 7;
}

message ApplyPrivateNetworkResponse {
  PrivateNetwork network = 1;
  MutationResult mutation = 2;
}

message RemovePrivateNetworkRequest {
  MutationHeader header = 1;
}

message RemovePrivateNetworkResponse {
  PrivateNetwork network = 1;
  MutationResult mutation = 2;
}

message RegisterIsolatedGuestRequest {
  MutationHeader header = 1;
  string reservation_id = 2;
  string network_id = 3;
  string ipv4 = 4;
  string mac = 5;
}

message RegisterIsolatedGuestResponse {
  IsolatedGuest guest = 1;
  MutationResult mutation = 2;
}

message RemoveIsolatedGuestRequest {
  MutationHeader header = 1;
  string network_id = 2;
}

message RemoveIsolatedGuestResponse {
  IsolatedGuest guest = 1;
  MutationResult mutation = 2;
}

// target_port is deliberately absent. Appliance relays always target port
// 9091.
message ApplyRelayRequest {
  MutationHeader header = 1;
  string reservation_id = 2;
  string vm_id = 3;
  string network_id = 4;
  uint32 listen_port = 5;
  string target_ipv4 = 6;
}

message RemoveRelayRequest {
  MutationHeader header = 1;
  string vm_id = 2;
  string network_id = 3;
}

message ListRelaysRequest {
  string network_id = 1;
  string vm_id = 2;
  bool include_retired = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

message ListRelaysResponse {
  repeated Relay relays = 1;
  string next_page_token = 2;
  uint64 appliance_generation = 3;
}

message GetRelayStatsRequest {
  string relay_id = 1;
}

message GetRelayStatsResponse {
  string relay_id = 1;
  string listener_state = 2;
  string bind_address = 3;
  uint64 active_connections = 4;
  uint64 total_accepted_connections = 5;
  uint64 bytes_guest_to_main = 6;
  uint64 bytes_main_to_guest = 7;
  int64 last_successful_connection_unix = 8;
  uint64 target_dial_failure_count = 9;
  string last_failure = 10;
  uint64 relay_generation = 11;
  uint64 appliance_generation = 12;
}

message RebindRelaysRequest {
  MutationHeader header = 1;
}

message RebindRelaysResponse {
  repeated Relay relays = 1;
  MutationResult mutation = 2;
}

message ValidateRelayRequest {
  string relay_id = 1;
  bool probe_target = 2;
}

message ValidateRelayResponse {
  Relay relay = 1;
  bool listener_valid = 2;
  bool mapping_valid = 3;
  bool generation_valid = 4;
  bool target_reachable = 5;
  string message = 6;
  uint64 appliance_generation = 7;
}

message AdoptRelayRequest {
  MutationHeader header = 1;
  string reservation_id = 2;
  string vm_id = 3;
  string network_id = 4;
  uint32 listen_port = 5;
  string target_ipv4 = 6;
}

message SetNatStateRequest {
  MutationHeader header = 1;
  string reservation_id = 2;
  string network_id = 3;
  string desired_state = 4;
  uint32 conntrack_mark = 5;
}

message ListNatStateRequest {
  string network_id = 1;
  string vm_id = 2;
  string state = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

message ListNatStateResponse {
  repeated NatState nat_states = 1;
  string next_page_token = 2;
  uint64 appliance_generation = 3;
}

message ReconcileNatRequest {
  MutationHeader header = 1;
  string network_id = 2;
}

message ReconcileNatResponse {
  NatState nat_state = 1;
  MutationResult mutation = 2;
}
