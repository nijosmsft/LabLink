name: ci

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "::error::gofmt diffs in:"
            echo "$fmt"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -timeout 5m

      - name: Windows installer and split-path updater tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & .\scripts\tests\LocalHyperV.Helpers.Tests.ps1
          if (-not $?) { exit 1 }
          & .\scripts\tests\Update-LabLink.Tests.ps1
          if (-not $?) { exit 1 }
          $env:PSModulePath = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          & powershell.exe -NoProfile -NonInteractive -File .\scripts\tests\LocalHyperV.Helpers.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
